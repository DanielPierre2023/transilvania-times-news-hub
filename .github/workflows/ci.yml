name: CI

# PREVIOUSLY there was no CI at all — the first signal that the build was
# broken was Netlify failing the deploy, after a push to main. This catches
# the same class of failure (broken package-lock.json vs package.json,
# TypeScript errors, lint errors) on every push and pull request, before
# it reaches a deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned to match netlify.toml's NODE_VERSION. If these two ever
          # disagree, CI is testing a build the site does not perform, which is
          # worse than having no CI at all.
          #
          # NOTE, 30 Aug 2026: several dependencies now declare node >= 22
          # (@supabase/* 2.112, sanitize-html 2.17) and npm prints EBADENGINE
          # warnings on 20. They are warnings, not errors — npm does not enforce
          # engines unless engine-strict is set — so this stays on 20 until the
          # site's own build environment is moved deliberately. Bumping CI alone
          # would make CI green on a configuration Netlify never runs.
          node-version: '20'
          cache: 'npm'

      # npm ci fails fast if package-lock.json doesn't match package.json —
      # exactly the drift found and fixed in this repo on 2026-08-14, and again
      # on 2026-08-30: package.json gained sanitize-html, mammoth and
      # @types/sanitize-html on 25 August through a web upload, which cannot run
      # npm install, so the lock stayed at its 15 August state. Every push since
      # has failed here. That is the check doing its job — but a red CI that
      # nobody acts on teaches people to ignore CI, so the lock is regenerated
      # rather than the check relaxed.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      # Flight-board date logic. The Cluj FIDS board publishes no dates, so a
      # date-matching regression silently tells readers their flight already
      # departed (this happened live on 2026-08-24). Pure Node, no network.
      - name: Flight status regression tests
        run: node supabase/functions/flights-sync/fids.regression.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Placeholder values so `next build` can complete static analysis
          # without real secrets. Server-only env vars used at request time
          # (not build time) don't need real values here; if the build starts
          # failing because it needs a real key at build time, add it as a
          # GitHub Actions secret rather than hardcoding it in this file.
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder'
